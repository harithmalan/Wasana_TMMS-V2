<header class="h-14 border-b border-border bg-card flex items-center justify-between px-5 flex-shrink-0">
  <div>
    <h3 class="text-base text-foreground">{{ title }}</h3>
    <p class="text-xs text-muted-foreground">Friday, 04/07/2026</p>
  </div>
  <div class="flex items-center gap-2">
    <!-- Dark mode toggle -->
    <button (click)="theme.toggle()" class="p-2 rounded-lg hover:bg-muted transition text-muted-foreground" style="background:none; border:none;">
      @if (theme.dark()) {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      } @else {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      }
    </button>

    <!-- Notifications -->
    <button (click)="navigate('/notifications')" class="p-2 rounded-lg hover:bg-muted transition text-muted-foreground relative" style="background:none; border:none;">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      @if (unreadCount > 0) {
        <span class="notif-dot"></span>
      }
    </button>

    <!-- Profile -->
    <div class="flex items-center gap-2 ml-2 cursor-pointer" (click)="navigate('/profile')">
      <div class="w-9 h-9 rounded-full bg-primary\/10 text-primary font-bold text-sm flex items-center justify-center flex-shrink-0">AR</div>
      <div class="hidden sm:block text-left">
        <p class="text-xs font-semibold text-foreground leading-tight">M.R. Premasiri</p>
        <p class="text-muted-foreground" style="font-size:10px;">Administrator</p>
      </div>
      <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>
</header>
