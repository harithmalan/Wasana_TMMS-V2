<aside
  class="flex flex-col h-full transition-all duration-300 overflow-hidden"
  [style.width]="collapsed() ? '64px' : '220px'"
  style="background: var(--sidebar); color: var(--sidebar-foreground);">

  <!-- Logo -->
  <div class="flex items-center gap-3 px-4 py-5 border-b" style="border-color: var(--sidebar-border);">
    <div class="w-8 h-8 rounded-lg bg-amber-500\/20 flex items-center justify-center flex-shrink-0">
      <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    @if (!collapsed()) {
      <span class="font-bold text-sm leading-tight whitespace-nowrap overflow-hidden" style="font-family: 'Playfair Display', serif; color: var(--sidebar-foreground);">
        Wasana<br><span style="font-size:10px; font-weight:400; opacity:0.6;">TimberMill MMS</span>
      </span>
    }
  </div>

  <!-- Nav -->
  <nav class="flex-1 py-4 overflow-y-auto">
    @for (item of navItems; track item.id) {
      <a
        [routerLink]="item.route"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-sm transition-all relative group no-underline"
        [style.background]="isActive(item.route) ? 'var(--sidebar-accent)' : 'transparent'"
        [style.color]="isActive(item.route) ? 'var(--sidebar-accent-foreground)' : 'var(--sidebar-foreground)'"
        [style.opacity]="isActive(item.route) ? '1' : '0.75'"
        style="display:flex; text-decoration:none;">
        @if (isActive(item.route)) {
          <div class="sidebar-active-bar"></div>
        }
        <ng-container [ngSwitch]="item.icon">
          <svg *ngSwitchCase="'dashboard'" class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <svg *ngSwitchCase="'inventory'" class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          <svg *ngSwitchCase="'customers'" class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <svg *ngSwitchCase="'suppliers'" class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          <svg *ngSwitchCase="'sales'" class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <svg *ngSwitchCase="'reports'" class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <svg *ngSwitchCase="'ai'" class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.04Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-1.04Z"/></svg>
          <svg *ngSwitchCase="'notifications'" class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <svg *ngSwitchCase="'users'" class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
          <svg *ngSwitchCase="'profile'" class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </ng-container>
        @if (!collapsed()) {
          <span class="whitespace-nowrap text-xs font-semibold">{{ item.label }}</span>
          @if (item.id === 'notifications' && unreadCount > 0) {
            <span class="ml-auto bg-red-500 text-white font-bold px-1.5 py-0.5 rounded-full" style="font-size:10px;">{{ unreadCount }}</span>
          }
        }
      </a>
    }
  </nav>

  <!-- Toggle / Logout -->
  <div class="border-t p-3 flex flex-col gap-1" style="border-color: var(--sidebar-border);">
    <button
      (click)="logout()"
      class="flex items-center gap-2 px-2 py-2 rounded-lg text-xs transition hover:opacity-80"
      style="color: #ef4444; opacity: 0.9; background:none; border:none; cursor:pointer;">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      @if (!collapsed()) {
        <span>Logout</span>
      }
    </button>
    <button
      (click)="toggleCollapse()"
      class="flex items-center gap-2 px-2 py-2 rounded-lg text-xs transition hover:opacity-80"
      style="color: var(--sidebar-foreground); opacity: 0.6; background:none; border:none; cursor:pointer;">
      @if (collapsed()) {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      } @else {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Collapse</span>
      }
    </button>
  </div>
</aside>
