<div>
  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem;">
    <div>
      <h2 style="font-size:1.25rem; color:var(--foreground);">Reports & Analytics</h2>
      <p style="font-size:0.875rem; color:var(--muted-foreground); margin-top:0.125rem;">Comprehensive business performance insights</p>
    </div>
    <button (click)="downloadPDF()" style="display:inline-flex; align-items:center; gap:0.375rem; padding:0.375rem 0.75rem; border-radius:0.5rem; background:var(--primary); color:var(--primary-foreground); font-size:0.875rem; font-weight:600; border:none; cursor:pointer;">
      <svg style="width:0.875rem; height:0.875rem;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download PDF
    </button>
  </div>

  <div class="reports-grid">
    <!-- Sales Trend -->
    <div style="background:var(--card); border-radius:0.75rem; padding:1.25rem; border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,0.05);">
      <div style="margin-bottom:1.25rem;">
        <h2 style="font-size:1.25rem; color:var(--foreground);">Sales Trend</h2>
        <p style="font-size:0.875rem; color:var(--muted-foreground); margin-top:0.125rem;">Revenue vs profit — 8 months</p>
      </div>
      <div style="height:200px; position:relative;"><canvas #chartCanvas></canvas></div>
    </div>

    <!-- Inventory Value -->
    <div style="background:var(--card); border-radius:0.75rem; padding:1.25rem; border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,0.05);">
      <div style="margin-bottom:1.25rem;">
        <h2 style="font-size:1.25rem; color:var(--foreground);">Inventory Value</h2>
        <p style="font-size:0.875rem; color:var(--muted-foreground); margin-top:0.125rem;">Stock value by timber type</p>
      </div>
      <div style="height:200px; position:relative;"><canvas #chartCanvas></canvas></div>
    </div>

    <!-- Monthly Profit -->
    <div style="background:var(--card); border-radius:0.75rem; padding:1.25rem; border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,0.05);">
      <div style="margin-bottom:1.25rem;">
        <h2 style="font-size:1.25rem; color:var(--foreground);">Monthly Profit</h2>
        <p style="font-size:0.875rem; color:var(--muted-foreground); margin-top:0.125rem;">Profit margin over time</p>
      </div>
      <div style="height:200px; position:relative;"><canvas #chartCanvas></canvas></div>
    </div>

    <!-- Stock Quantities -->
    <div style="background:var(--card); border-radius:0.75rem; padding:1.25rem; border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,0.05);">
      <div style="margin-bottom:1.25rem;">
        <h2 style="font-size:1.25rem; color:var(--foreground);">Stock Quantities</h2>
        <p style="font-size:0.875rem; color:var(--muted-foreground); margin-top:0.125rem;">Current m³ by timber type</p>
      </div>
      <div style="height:200px; position:relative;"><canvas #chartCanvas></canvas></div>
    </div>
  </div>
</div>

<style>
  .reports-grid { display:grid; grid-template-columns:1fr; gap:1rem; }
  @media (min-width: 1280px) { .reports-grid { grid-template-columns: repeat(2,1fr); } }
</style>
