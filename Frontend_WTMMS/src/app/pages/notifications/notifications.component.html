<div>
  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem;">
    <div>
      <h2 style="font-size:1.25rem; color:var(--foreground);">Notifications</h2>
      <p style="font-size:0.875rem; color:var(--muted-foreground); margin-top:0.125rem;">{{ unreadCount }} unread notifications</p>
    </div>
    <button (click)="markAllRead()" style="display:inline-flex; align-items:center; gap:0.375rem; padding:0.375rem 0.75rem; border-radius:0.5rem; border:1px solid var(--border); background:var(--card); color:var(--foreground); font-size:0.875rem; font-weight:600; cursor:pointer;">
      Mark all read
    </button>
  </div>

  <!-- Notification List -->
  <div style="display:flex; flex-direction:column; gap:0.5rem;">
    @for (n of notifications(); track n.id) {
      <div
        (click)="markRead(n.id)"
        style="display:flex; align-items:flex-start; gap:0.75rem; padding:1rem; border-radius:0.75rem; border:1px solid; cursor:pointer; transition:box-shadow 0.15s;"
        [style.background]="n.read ? 'var(--card)' : 'rgba(92,46,14,0.05)'"
        [style.border-color]="n.read ? 'var(--border)' : 'rgba(92,46,14,0.2)'">

        <!-- Icon -->
        <div style="padding:0.5rem; border-radius:0.5rem; flex-shrink:0;" [style.background]="iconConfig(n.type).bg">
          @switch (n.type) {
            @case ('critical') {
              <svg style="width:1rem; height:1rem;" [style.color]="iconConfig(n.type).color" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            }
            @case ('warning') {
              <svg style="width:1rem; height:1rem;" [style.color]="iconConfig(n.type).color" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            }
            @case ('success') {
              <svg style="width:1rem; height:1rem;" [style.color]="iconConfig(n.type).color" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            }
            @default {
              <svg style="width:1rem; height:1rem;" [style.color]="iconConfig(n.type).color" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            }
          }
        </div>

        <!-- Content -->
        <div style="flex:1; min-width:0;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:0.5rem;">
            <p style="font-size:0.875rem; font-weight:600;"
              [style.color]="n.read ? 'var(--foreground)' : 'var(--primary)'">{{ n.title }}</p>
            <span style="font-size:0.75rem; color:var(--muted-foreground); white-space:nowrap;">{{ n.time }}</span>
          </div>
          <p style="font-size:0.75rem; color:var(--muted-foreground); margin-top:0.125rem; line-height:1.625;">{{ n.message }}</p>
        </div>

        <!-- Unread dot -->
        @if (!n.read) {
          <div style="width:0.5rem; height:0.5rem; border-radius:50%; background:var(--primary); flex-shrink:0; margin-top:0.375rem;"></div>
        }
      </div>
    }
  </div>
</div>
